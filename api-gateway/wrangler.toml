name = "clipmint-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Environment variables — set via `wrangler secret put`
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# GITHUB_TOKEN
# GITHUB_REPO (e.g. "TeraBhaiHoon/ClipMint-NovaMint")

[vars]
# Dashboard origins allowed to call this API — comma-separated allowlist.
# vikashbuilds.in is the temporary split-account domain; novamintnetworks.in
# is the final agency domain once the project is reimported on the main
# Vercel account. Both stay valid so no redeploy is needed at the switch.
CORS_ORIGIN = "https://clipmint.vikashbuilds.in,https://clipmint.novamintnetworks.in"
RATE_LIMIT_PER_MINUTE = 30

# KV namespace for rate limiting and caching
[[kv_namespaces]]
binding = "CACHE"
id = "55b5044b918345eabcadd5bc6868410b"
