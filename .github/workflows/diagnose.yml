# ClipMint — Live Dependency Diagnostics
#
# Read-only probe of every external dependency the pipeline depends on.
# Prints a machine-readable report; changes nothing.
#
# Run:  gh workflow run diagnose.yml
name: Diagnose Dependencies

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
          pip install -q -U yt-dlp requests

      - name: Probe Groq (models + chat + transcription)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          key = os.environ.get("GROQ_API_KEY", "")
          print(f"GROQ_API_KEY present: {bool(key)} (len={len(key)}, prefix={key[:4] if key else 'n/a'})")
          if not key:
              raise SystemExit("no key")
          H = {"Authorization": f"Bearer {key}"}

          print("\n=== 1. /openai/v1/models ===")
          try:
              r = requests.get("https://api.groq.com/openai/v1/models", headers=H, timeout=30)
              print("HTTP", r.status_code)
              if r.status_code == 200:
                  ids = sorted(m["id"] for m in r.json().get("data", []))
                  print(f"{len(ids)} models:")
                  for i in ids:
                      print("   -", i)
              else:
                  print(r.text[:500])
          except Exception as e:
              print("ERR", e)

          # Chat models to try: the pipeline's current one first, then modern replacements
          candidates = [
              "llama-3.3-70b-versatile",
              "llama-3.1-8b-instant",
              "openai/gpt-oss-120b",
              "openai/gpt-oss-20b",
              "qwen/qwen3-32b",
              "moonshotai/kimi-k2-instruct",
              "meta-llama/llama-4-scout-17b-16e-instruct",
              "meta-llama/llama-4-maverick-17b-128e-instruct",
          ]
          print("\n=== 2. Chat completion probe (per model) ===")
          for m in candidates:
              try:
                  r = requests.post(
                      "https://api.groq.com/openai/v1/chat/completions",
                      headers={**H, "Content-Type": "application/json"},
                      json={"model": m, "messages": [{"role": "user", "content": "Reply with the single word OK"}],
                            "max_tokens": 2000, "temperature": 0},
                      timeout=45,
                  )
                  if r.status_code == 200:
                      body = r.json()
                      txt = body["choices"][0]["message"].get("content") or ""
                      print(f"  ✅ {m:55s} OK  -> {txt.strip()[:40]!r}")
                  else:
                      print(f"  ❌ {m:55s} HTTP {r.status_code}: {r.text[:180]}")
              except Exception as e:
                  print(f"  ❌ {m:55s} ERR {e}")

          print("\n=== 3. Transcription probe (whisper large-v3-turbo on 3s tone) ===")
          os.system("ffmpeg -f lavfi -i 'sine=frequency=440:duration=3' -ar 16000 -ac 1 /tmp/probe.wav -y -loglevel quiet")
          for m in ["whisper-large-v3-turbo", "whisper-large-v3"]:
              try:
                  with open("/tmp/probe.wav", "rb") as f:
                      r = requests.post(
                          "https://api.groq.com/openai/v1/audio/transcriptions",
                          headers=H,
                          files={"file": ("probe.wav", f, "audio/wav")},
                          data={"model": m, "response_format": "verbose_json",
                                "timestamp_granularities[]": "word"},
                          timeout=90,
                      )
                  print(f"  {'✅' if r.status_code == 200 else '❌'} {m}: HTTP {r.status_code} {r.text[:200] if r.status_code != 200 else ''}")
              except Exception as e:
                  print(f"  ❌ {m}: {e}")

          print("\n=== 4. Rate-limit headers (from last 429 if any) ===")
          try:
              r = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={**H, "Content-Type": "application/json"},
                  json={"model": "llama-3.3-70b-versatile", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 3000},
                  timeout=45,
              )
              for k, v in r.headers.items():
                  if "ratelimit" in k.lower() or "retry" in k.lower():
                      print(f"   {k}: {v}")
              print("   status:", r.status_code)
          except Exception as e:
              print("   ERR", e)
          PY

      - name: Probe NVIDIA NIM
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, requests
          key = os.environ.get("NVIDIA_NIM_API_KEY", "")
          print(f"NVIDIA_NIM_API_KEY present: {bool(key)}")
          if not key:
              raise SystemExit(0)
          H = {"Authorization": f"Bearer {key}"}
          r = requests.get("https://integrate.api.nvidia.com/v1/models", headers=H, timeout=30)
          print("models HTTP", r.status_code)
          if r.status_code == 200:
              ids = [m["id"] for m in r.json().get("data", [])]
              asr = [i for i in ids if any(k in i.lower() for k in ("whisper", "parakeet", "canary", "asr"))]
              print(f"{len(ids)} total models; ASR-capable: {asr}")
          else:
              print(r.text[:400])
          PY

      - name: Probe yt-dlp + cookies (the current failure)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
          echo "cookie file bytes: $(stat --printf='%s' /tmp/yt_cookies.txt)"
          echo "cookie file first line: $(head -1 /tmp/yt_cookies.txt | cut -c1-120)"
          echo "cookie line count: $(wc -l < /tmp/yt_cookies.txt)"
          echo
          echo "=== A. cookie validity: fetch a public video's metadata WITH cookies ==="
          yt-dlp --cookies /tmp/yt_cookies.txt --skip-download --print "%(id)s|%(title)s|%(duration)s" \
            "https://www.youtube.com/watch?v=aqz-KE-bpKQ" 2>&1 | tail -20 || true
          echo
          echo "=== B. same WITHOUT cookies (is a cookie-less download viable?) ==="
          yt-dlp --skip-download --print "%(id)s|%(title)s|%(duration)s" \
            "https://www.youtube.com/watch?v=aqz-KE-bpKQ" 2>&1 | tail -20 || true
          echo
          echo "=== C. yt-dlp version ==="
          yt-dlp --version

      - name: Probe rclone + Google Drive
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf 2>/dev/null || echo "base64 decode failed"
          echo "remotes: $(rclone listremotes)"
          echo "configured folder id: ${GDRIVE_FOLDER_ID:0:8}..."
          REMOTE=$(rclone listremotes | head -1 | tr -d ':')
          rclone about "${REMOTE}:" 2>&1 | head -10 || true
          echo "--- lsf root folder ---"
          rclone lsf "${REMOTE}:" --drive-root-folder-id="$GDRIVE_FOLDER_ID" --max-depth 1 2>&1 | head -20 || true

      - name: Probe Supabase (schema + realtime publication)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, requests
          url = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_KEY"]
          H = {"apikey": key, "Authorization": f"Bearer {key}"}
          print("SUPABASE_URL:", url)

          for table in ["profiles", "jobs", "clips", "api_keys", "payments"]:
              r = requests.get(f"{url}/rest/v1/{table}?select=*&limit=1", headers=H, timeout=30)
              if r.status_code == 200:
                  rows = r.json()
                  cols = sorted(rows[0].keys()) if rows else []
                  print(f"  ✅ {table:10s} rows>=1 cols={cols if cols else '(empty table, columns unknown)'}")
                  if not cols:
                      # ask PostgREST for the shape anyway
                      r2 = requests.get(f"{url}/rest/v1/{table}?select=*&limit=0",
                                        headers={**H, "Prefer": "count=exact"}, timeout=30)
                      print(f"     (limit=0 probe: {r2.status_code})")
              else:
                  print(f"  ❌ {table:10s} HTTP {r.status_code}: {r.text[:200]}")

          print("\n=== jobs status census ===")
          r = requests.get(f"{url}/rest/v1/jobs?select=status,count&group=status", headers=H, timeout=30)
          print(r.status_code, r.text[:500])

          print("\n=== last 10 jobs ===")
          r = requests.get(
              f"{url}/rest/v1/jobs?select=id,status,progress,caption_style,clips_count,error_message,created_at"
              f"&order=created_at.desc&limit=10", headers=H, timeout=30)
          if r.status_code == 200:
              for j in r.json():
                  print(f"  {j['created_at'][:19]} {j['status']:12s} p={j.get('progress')} clips={j.get('clips_count')} err={(j.get('error_message') or '')[:60]}")
          else:
              print(r.status_code, r.text[:300])

          print("\n=== realtime publication membership (via SQL RPC is not available; probing REST) ===")
          print("NOTE: publication membership cannot be read over PostgREST; check Supabase dashboard > Database > Replication.")
          PY
