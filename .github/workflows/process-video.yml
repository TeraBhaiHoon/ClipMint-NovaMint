# ClipMint — Video Processing Pipeline
#
# Flow: download → transcribe → analyse → prepare clips (vertical + loudness)
#       → render animated captions → thumbnails → upload → record results
#
# Triggered by the API Gateway or the dashboard via workflow_dispatch.
#
# Design rules learned from production incidents (see _audit/FINDINGS.md):
#
#  1. NOTHING fails silently. The previous version fell back to copying the raw
#     uncaptioned clip whenever Remotion errored, so the product shipped
#     caption-less videos while reporting success — which hid a Remotion
#     version mismatch indefinitely.
#  2. User input NEVER reaches a shell line through ${{ inputs.* }}
#     interpolation; it is passed via the environment and quoted.
#  3. Every step records its name, so a failure can name the exact stage.
#  4. Trimming happens in ffmpeg, not in the renderer, so video and caption
#     timelines cannot drift apart.

name: Process Video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Supabase job ID"
        required: true
        type: string
      video_url:
        description: "Source video URL"
        required: true
        type: string
      caption_style:
        description: "Caption style preset"
        required: false
        default: "hormozi"
        type: choice
        options:
          - hormozi
          - bounce
          - fade
          - glow
          - typewriter
          - glitch
          - neon
          - colorful
          - minimal
      max_clips:
        description: "Maximum number of clips to generate"
        required: false
        default: "10"
        type: string

concurrency:
  group: clipmint-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  CLIPMINT_AUDIO_REACTIVE: "1"

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    # Supabase credentials are job-level because almost every stage reports
    # progress or results. Declaring them once prevents the class of bug where a
    # status step silently lacks credentials and fails the whole run — which is
    # exactly what happened on the first attempt at this workflow.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # 1. Setup
      # ─────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: remotion-captions/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick rclone fonts-dejavu-core
          pip install -q -U yt-dlp requests
          # Deno is required by yt-dlp to solve YouTube's n-signature challenge.
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install Remotion dependencies
        working-directory: remotion-captions
        run: |
          set -euo pipefail
          # Every @remotion/* package is pinned to one version and the lockfile is
          # committed. A mismatched tree makes Remotion abort EVERY render, which
          # is what previously made the pipeline ship uncaptioned clips.
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          node -e "console.log('remotion', require('remotion/package.json').version)"
          node -e "console.log('@remotion/media', require('@remotion/media/package.json').version)"
          node -e "console.log('@remotion/google-fonts', require('@remotion/google-fonts/package.json').version)"

      - name: Install pipeline Python dependencies
        run: |
          set -euo pipefail
          if [ -f pipeline/requirements.txt ]; then
            pip install -q -r pipeline/requirements.txt
          fi
          python3 -c "import cv2; print('opencv', cv2.__version__)" \
            || echo "WARN: OpenCV unavailable — reframing will fall back to a centre crop"

      - name: Create workspace
        run: |
          set -euo pipefail
          mkdir -p workspace/source workspace/audio workspace/clips \
                   workspace/captioned workspace/thumbnails workspace/output
          # Records the running stage so failures can be reported precisely.
          echo "setup" > workspace/.current_step

      - name: Validate inputs
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          job_id = os.environ["JOB_ID"].strip()
          url = os.environ["VIDEO_URL"].strip()
          errors = []
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", job_id):
              errors.append(f"job_id is not a UUID: {job_id!r}")
          if len(url) > 2048:
              errors.append("video_url exceeds 2048 characters")
          # Narrow set: whitespace and control characters are never valid inside a
          # URL, and backtick, `$` and `\` could break out of a quoted string.
          # `&`, `;` and friends ARE allowed because they appear in ordinary links
          # such as youtube.com/watch?v=ID&list=... which users legitimately paste.
          if re.search(r"[\x00-\x1f\s`$\\]", url):
              errors.append("video_url contains whitespace, control characters or unsafe metacharacters")
          if not url.lower().startswith(("http://", "https://")):
              errors.append("video_url must be an http(s) URL")
          if errors:
              print("INPUT_VALIDATION_FAILED:", "; ".join(errors))
              sys.exit(1)
          print(f"inputs ok: job={job_id} host={url.split('/')[2]}")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # 2. Download
      # ─────────────────────────────────────────────────────────────────────
      - name: "Mark: downloading"
        run: python3 pipeline/db.py set-status --job-id "${{ inputs.job_id }}" --status downloading --progress 5

      - name: Download source video
        id: download
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          echo "download" > workspace/.current_step

          # Cookies are optional: a missing file must not break non-YouTube
          # sources, so its state is reported rather than required.
          if [ -n "${YOUTUBE_COOKIES:-}" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "cookies: $(wc -l < /tmp/yt_cookies.txt) lines, $(stat --printf='%s' /tmp/yt_cookies.txt) bytes"
          else
            : > /tmp/yt_cookies.txt
            echo "cookies: none configured"
          fi

          COOKIE_ARG=""
          if [ -s /tmp/yt_cookies.txt ]; then
            COOKIE_ARG="--cookies /tmp/yt_cookies.txt"
          fi

          echo "host: $(echo "$VIDEO_URL" | cut -d/ -f3)"

          # YouTube's bot checks are client-specific, so trying progressively
          # different player clients clears most "Sign in to confirm you're not
          # a bot" failures without any other change.
          ATTEMPTS=(
            "--extractor-args youtube:player_client=default,tv,web_safari"
            "--extractor-args youtube:player_client=web_safari,tv_embedded"
            "--extractor-args youtube:player_client=android_vr"
            ""
          )

          DOWNLOADED=0
          for i in "${!ATTEMPTS[@]}"; do
            EXTRA="${ATTEMPTS[$i]}"
            echo "── download attempt $((i + 1))/${#ATTEMPTS[@]} ${EXTRA:-generic} ──"
            # shellcheck disable=SC2086
            if yt-dlp \
                --js-runtimes deno \
                --remote-components ejs:github \
                --force-ipv4 \
                --retries 5 --fragment-retries 5 --retry-sleep 3 \
                --format "bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=1080]+bestaudio/best[height<=1080]/best" \
                --merge-output-format mp4 \
                --output "workspace/source/source.%(ext)s" \
                --no-playlist --socket-timeout 60 \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                --sleep-requests 1 --min-sleep-interval 1 --max-sleep-interval 3 \
                $COOKIE_ARG $EXTRA "$VIDEO_URL" 2>&1 | tee /tmp/ytdlp.log; then
              if [ -s workspace/source/source.mp4 ]; then DOWNLOADED=1; break; fi
            fi
            echo "attempt $((i + 1)) failed"
            rm -f workspace/source/source.*
          done

          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "════════ DOWNLOAD DIAGNOSIS ════════"
            if grep -qi "sign in to confirm\|not a bot" /tmp/ytdlp.log; then
              echo "YOUTUBE_BOT_CHECK — YouTube rejected the request as automated."
              echo "  Fix: refresh the YOUTUBE_COOKIES secret from a signed-in browser session."
            elif grep -qi "cookies are no longer valid\|rotated" /tmp/ytdlp.log; then
              echo "YOUTUBE_COOKIES_STALE — the stored cookies were rotated by YouTube."
              echo "  Fix: re-export cookies and update the YOUTUBE_COOKIES secret."
            elif grep -qi "Unsupported URL" /tmp/ytdlp.log; then
              echo "UNSUPPORTED_URL — this host is not supported."
              echo "  Supported: YouTube, Instagram, Facebook, Vimeo, Google Drive, direct video file."
            elif grep -qi "Private video\|members-only\|age" /tmp/ytdlp.log; then
              echo "ACCESS_DENIED — the video is private, members-only or age-restricted."
            fi
            tail -25 /tmp/ytdlp.log
            exit 1
          fi

          SIZE=$(stat --printf='%s' workspace/source/source.mp4)
          DURATION=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 workspace/source/source.mp4 || echo 0)
          echo "downloaded ${SIZE} bytes, ${DURATION}s"

          # Reject a broken download before spending minutes transcribing it.
          if [ "$SIZE" -lt 10240 ]; then
            echo "DOWNLOAD_INVALID: file is under 10 KB"; exit 1
          fi
          if ! python3 -c "
          import sys
          d = float('${DURATION}' or 0)
          sys.exit(0 if d >= 5 else 1)
          "; then
            echo "DOWNLOAD_INVALID: duration under 5 seconds (${DURATION})"; exit 1
          fi

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────
      # 3. Audio
      # ─────────────────────────────────────────────────────────────────────
      - name: Extract audio
        run: |
          set -euo pipefail
          echo "extract_audio" > workspace/.current_step
          ffmpeg -i workspace/source/source.mp4 \
            -vn -acodec pcm_s16le -ar 16000 -ac 1 \
            workspace/audio/audio.wav -y -loglevel warning

      - name: "Mark: transcribing"
        run: python3 pipeline/db.py set-status --job-id "${{ inputs.job_id }}" --status transcribing --progress 20

      - name: Transcribe audio
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          echo "transcribe" > workspace/.current_step
          python3 - <<'PY'
          import glob, json, os, re, sys, time
          import requests

          key = os.environ.get("GROQ_API_KEY", "").strip()
          if not key:
              print("FATAL: GROQ_API_KEY is not set"); sys.exit(1)

          GROQ_URL = "https://api.groq.com/openai/v1/audio/transcriptions"
          # large-v3-turbo is much faster at nearly identical accuracy; the full
          # v3 model is the accuracy fallback when turbo is rate limited.
          MODELS = ["whisper-large-v3-turbo", "whisper-large-v3"]
          SEGMENT_SECONDS = 300
          MAX_BYTES = 24_000_000

          wav = "workspace/audio/audio.wav"
          size = os.path.getsize(wav)
          print(f"audio: {size} bytes")

          for old in glob.glob("workspace/audio/chunk_*.wav"):
              os.remove(old)

          if size > MAX_BYTES:
              print("splitting into 5-minute chunks")
              os.system(
                  f'ffmpeg -i {wav} -f segment -segment_time {SEGMENT_SECONDS} '
                  f'-c copy "workspace/audio/chunk_%03d.wav" -y -loglevel error'
              )
          else:
              os.system(f'cp {wav} workspace/audio/chunk_000.wav')

          chunks = sorted(glob.glob("workspace/audio/chunk_*.wav"))
          if not chunks:
              print("FATAL: no audio chunks produced"); sys.exit(1)
          print(f"chunks: {len(chunks)}")

          def post_chunk(path, model, language=None):
              form = {
                  "model": model,
                  "response_format": "verbose_json",
                  "timestamp_granularities[]": "word",
              }
              if language:
                  form["language"] = language
              with open(path, "rb") as fh:
                  return requests.post(
                      GROQ_URL,
                      headers={"Authorization": f"Bearer {key}"},
                      files={"file": (os.path.basename(path), fh, "audio/wav")},
                      data=form, timeout=300,
                  )

          def transcribe_chunk(path, language=None):
              """First successful response for one chunk, across models."""
              for model in MODELS:
                  for attempt in range(3):
                      try:
                          resp = post_chunk(path, model, language)
                      except requests.RequestException as exc:
                          wait = 2 ** attempt * 5
                          print(f"  {model}: network error ({exc}); retry in {wait}s")
                          time.sleep(wait); continue
                      if resp.status_code == 200:
                          data = resp.json()
                          if data.get("words") or data.get("segments"):
                              print(f"  {model}: ok (lang={data.get('language')})")
                              return data
                          print(f"  {model}: HTTP 200 but no words/segments")
                          break
                      if resp.status_code in (429, 500, 502, 503):
                          wait = 2 ** attempt * 5
                          print(f"  {model}: HTTP {resp.status_code}; retry in {wait}s")
                          time.sleep(wait); continue
                      print(f"  {model}: HTTP {resp.status_code} {resp.text[:200]}")
                      break
              return None

          HALLUCINATIONS = {
              "thank you for watching", "thanks for watching",
              "subscribe to my channel", "please like and share",
              "please subscribe", "like share and subscribe",
              "don't forget to subscribe", "hit the bell icon",
              "see you in the next video", "subtitles by", "captions by",
              "translated by", "music playing",
          }

          def clean(words):
              """Remove Whisper's punctuation-only tokens, repetition loops and
              known hallucinated sign-offs."""
              kept = []
              for w in words:
                  text = (w.get("text") or "").strip()
                  if not text:
                      continue
                  if re.fullmatch(r"[^\w\s]+", text):
                      continue
                  if len(text) == 1 and text.lower() not in ("i", "a", "o"):
                      continue
                  span = w["endMs"] - w["startMs"]
                  if span <= 0 or span > 8000:
                      continue
                  kept.append(w)

              deduped, run = [], 1
              for i, w in enumerate(kept):
                  if i > 0 and w["text"].lower() == kept[i - 1]["text"].lower():
                      run += 1
                      if run > 3:
                          continue
                  else:
                      run = 1
                  deduped.append(w)

              final, skip_to = [], -1
              for i, w in enumerate(deduped):
                  if i < skip_to:
                      continue
                  escaped = False
                  for phrase in HALLUCINATIONS:
                      n = len(phrase.split())
                      window = " ".join(d["text"].lower() for d in deduped[i:i + n])
                      if window == phrase:
                          print(f"    removed hallucination: {phrase!r}")
                          skip_to = i + n
                          escaped = True
                          break
                  if not escaped:
                      final.append(w)
              return final

          all_words, detected = [], None
          for idx, chunk in enumerate(chunks):
              offset = idx * SEGMENT_SECONDS
              print(f"chunk {idx + 1}/{len(chunks)} (offset {offset}s)")
              data = transcribe_chunk(chunk, detected)
              if data is None:
                  print(f"FATAL: transcription failed on chunk {idx + 1}")
                  sys.exit(1)

              if detected is None:
                  raw = (data.get("language") or "en").lower()
                  detected = {
                      "hindi": "hi", "english": "en", "hinglish": "hi", "urdu": "ur",
                      "punjabi": "pa", "tamil": "ta", "telugu": "te", "bengali": "bn",
                      "marathi": "mr", "gujarati": "gu", "kannada": "kn", "malayalam": "ml",
                  }.get(raw, raw)
                  print(f"language locked: {detected}")

              words = [
                  {
                      # Text is kept verbatim. The renderer groups caption pages by
                      # word count / pause / punctuation and NEVER by leading
                      # whitespace, so this cannot collapse the pages the way the
                      # previous TikTok-grouping helper did.
                      "text": w.get("word", w.get("text", "")).strip(),
                      "startMs": int((w["start"] + offset) * 1000),
                      "endMs": int((w["end"] + offset) * 1000),
                      "timestampMs": None,
                      "confidence": w.get("probability"),
                  }
                  for w in (data.get("words") or [])
                  if w.get("start") is not None
              ]

              if not words and data.get("segments"):
                  # Spread each segment's words evenly so captions still get
                  # per-word timings when the provider omits word granularity.
                  for seg in data["segments"]:
                      tokens = (seg.get("text") or "").split()
                      if not tokens:
                          continue
                      span = (seg["end"] - seg["start"]) / len(tokens)
                      for i, tok in enumerate(tokens):
                          words.append({
                              "text": tok,
                              "startMs": int((seg["start"] + offset + i * span) * 1000),
                              "endMs": int((seg["start"] + offset + (i + 1) * span) * 1000),
                              "timestampMs": None,
                              "confidence": None,
                          })
              all_words.extend(words)

          if not all_words:
              print("FATAL: transcript is empty"); sys.exit(1)

          cleaned = clean(all_words)
          print(f"words: {len(all_words)} raw -> {len(cleaned)} filtered")
          if len(cleaned) < 10:
              print("FATAL: too few words survive filtering"); sys.exit(1)

          json.dump(cleaned, open("workspace/audio/full_captions.json", "w"))
          open("workspace/audio/detected_language.txt", "w").write(detected or "en")
          print(f"TRANSCRIBE_OK words={len(cleaned)} language={detected}")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # 4. Hinglish transliteration
      # ─────────────────────────────────────────────────────────────────────
      - name: Transliterate Devanagari to Hinglish
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          echo "transliterate" > workspace/.current_step
          python3 - <<'PY'
          import json, os, re, sys, time
          import requests

          key = os.environ.get("GROQ_API_KEY", "").strip()
          captions = json.load(open("workspace/audio/full_captions.json"))
          devanagari = re.compile(r"[\u0900-\u097F]")
          targets = [i for i, c in enumerate(captions) if devanagari.search(c["text"])]

          if not targets:
              print("no Devanagari text — nothing to transliterate")
              sys.exit(0)

          print(f"{len(targets)} of {len(captions)} words are Devanagari")
          MODEL = os.environ.get("CLIPMINT_LLM_MODEL", "openai/gpt-oss-120b")
          BATCH = 60
          failed_batches = 0

          for start in range(0, len(targets), BATCH):
              group = targets[start:start + BATCH]
              enriched = "\n".join(
                  f'{n + 1}. "{captions[i]["text"]}" (context: '
                  f'{" ".join(c["text"] for c in captions[max(0, i - 2):i + 3])})'
                  for n, i in enumerate(group)
              )
              prompt = (
                  "Convert these Hindi (Devanagari) words to natural Hinglish "
                  "(romanised Hindi as Indians actually type it).\n"
                  "Rules: do not translate to English; keep Latin-script words exactly "
                  "as they are; use the context to pick the right romanisation; "
                  'return ONLY JSON {"words": [...]} in the same order.\n\n'
                  f"Words:\n{enriched}"
              )
              done = False
              for attempt in range(3):
                  try:
                      resp = requests.post(
                          "https://api.groq.com/openai/v1/chat/completions",
                          headers={"Authorization": f"Bearer {key}",
                                   "Content-Type": "application/json"},
                          json={
                              "model": MODEL,
                              "messages": [
                                  {"role": "system", "content": "You romanise Hindi to natural Hinglish. Return only JSON."},
                                  {"role": "user", "content": prompt},
                              ],
                              "temperature": 0.1,
                              "max_tokens": 3000,
                              "response_format": {"type": "json_object"},
                          },
                          timeout=120,
                      )
                      if resp.status_code != 200:
                          print(f"  HTTP {resp.status_code}: {resp.text[:200]}")
                          time.sleep(2 ** attempt * 3)
                          continue
                      parsed = json.loads(resp.json()["choices"][0]["message"]["content"])
                      out = parsed.get("words") if isinstance(parsed, dict) else parsed
                      if not isinstance(out, list) or len(out) != len(group):
                          print("  length mismatch; retrying")
                          time.sleep(2)
                          continue
                      for idx, value in zip(group, out):
                          value = str(value).strip()
                          if value:
                              captions[idx]["text"] = value
                      done = True
                      break
                  except Exception as exc:  # noqa: BLE001
                      print(f"  error: {exc}")
                      time.sleep(2 ** attempt * 3)
              if not done:
                  failed_batches += 1

          json.dump(captions, open("workspace/audio/full_captions.json", "w"))
          remaining = sum(1 for c in captions if devanagari.search(c["text"]))
          print(f"TRANSLITERATE_OK remaining_devanagari={remaining} failed_batches={failed_batches}")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # 5. Audio analysis
      # ─────────────────────────────────────────────────────────────────────
      - name: Analyse audio energy
        run: |
          set -euo pipefail
          echo "audio_energy" > workspace/.current_step
          ffmpeg -i workspace/audio/audio.wav \
            -af "astats=metadata=1:reset=1,ametadata=print:key=lavfi.astats.Overall.RMS_level:file=workspace/audio/energy.txt" \
            -f null - 2>/dev/null || true
          echo "energy samples: $(grep -c RMS_level workspace/audio/energy.txt 2>/dev/null || echo 0)"

      - name: Detect silence gaps
        run: |
          set -euo pipefail
          echo "silence_detect" > workspace/.current_step

          # The loudnorm measurement pass reports this file's own noise floor,
          # which adapts the threshold to quiet podcasts and loud music alike —
          # no hardcoded dB value.
          LOUDNORM_JSON=$(ffmpeg -i workspace/audio/audio.wav \
            -af "loudnorm=print_format=json" -f null - 2>&1 | sed -n '/{/,/}/p')

          THRESHOLD=$(echo "$LOUDNORM_JSON" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              value = float(data.get('input_thresh', '-35.0'))
              print(f'{max(-50.0, min(-20.0, value)):.1f}')
          except Exception:
              print('-35.0')
          " 2>/dev/null || echo "-35.0")

          echo "noise floor: ${THRESHOLD}dB"
          ffmpeg -i workspace/audio/audio.wav \
            -af "silencedetect=noise=${THRESHOLD}dB:d=0.25" \
            -f null - 2>&1 | grep "silence_" > workspace/audio/silences.txt || true

          echo "silence markers: $(wc -l < workspace/audio/silences.txt)"

      # ─────────────────────────────────────────────────────────────────────
      # 6. Viral moment detection
      # ─────────────────────────────────────────────────────────────────────
      - name: "Mark: analyzing"
        run: python3 pipeline/db.py set-status --job-id "${{ inputs.job_id }}" --status analyzing --progress 40

      - name: Detect viral moments
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_CLIPS: ${{ inputs.max_clips }}
          VIDEO_DURATION: ${{ steps.download.outputs.duration }}
        run: |
          set -euo pipefail
          echo "viral_detection" > workspace/.current_step
          python3 - <<'PY'
          import json, os, re, statistics, sys, time
          import requests

          key = os.environ["GROQ_API_KEY"].strip()
          max_clips = max(1, min(int(os.environ.get("MAX_CLIPS", "10") or 10), 20))
          duration = float(os.environ.get("VIDEO_DURATION", "0") or 0)

          captions = json.load(open("workspace/audio/full_captions.json"))
          print(f"words: {len(captions)}  video: {duration:.0f}s  max_clips: {max_clips}")
          if not captions:
              print("FATAL: no captions to analyse"); sys.exit(1)

          # gpt-oss-120b replaced the retired llama-3.3-70b-versatile, which now
          # returns HTTP 404 model_not_found on this account.
          MODELS = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.8-27b"]

          def ask(prompt, is_json, max_tokens=4096):
              last = None
              for model in MODELS:
                  for attempt in range(3):
                      try:
                          resp = requests.post(
                              "https://api.groq.com/openai/v1/chat/completions",
                              headers={"Authorization": f"Bearer {key}",
                                       "Content-Type": "application/json"},
                              json={
                                  "model": model,
                                  "messages": [
                                      {"role": "system", "content": (
                                          "You are a short-form video editor who finds "
                                          "clips that perform on Reels, Shorts and TikTok."
                                          + (" Return only valid JSON." if is_json else "")
                                      )},
                                      {"role": "user", "content": prompt},
                                  ],
                                  "temperature": 0.6,
                                  "max_tokens": max_tokens,
                                  **({"response_format": {"type": "json_object"}} if is_json else {}),
                              },
                              timeout=180,
                          )
                          if resp.status_code == 200:
                              return resp.json()["choices"][0]["message"]["content"]
                          last = f"{model} HTTP {resp.status_code}: {resp.text[:200]}"
                          if resp.status_code in (429, 500, 502, 503):
                              time.sleep(2 ** attempt * 5)
                              continue
                          break
                      except requests.RequestException as exc:
                          last = f"{model}: {exc}"
                          time.sleep(2 ** attempt * 4)
                  print(f"  model {model} exhausted: {last}")
              raise RuntimeError(f"all models failed: {last}")

          # ── Time-indexed transcript windows ────────────────────────────
          text, timemap = "", []
          for c in captions:
              for ch in c["text"] + " ":
                  text += ch
                  timemap.append(c["startMs"] / 1000.0)

          def time_at(idx):
              if not timemap:
                  return 0.0
              return timemap[min(max(idx, 0), len(timemap) - 1)]

          WINDOW_CHARS, OVERLAP_CHARS = 7000, 1200
          step = WINDOW_CHARS - OVERLAP_CHARS
          windows = []
          for start in range(0, max(1, len(text)), step):
              chunk = text[start:start + WINDOW_CHARS]
              if len(chunk.strip()) < 60:
                  continue
              windows.append({
                  "text": chunk,
                  "start": time_at(start),
                  "end": time_at(start + len(chunk)),
              })
          print(f"windows: {len(windows)}")

          length_hint = (
              f" The source video is {duration:.0f}s long; keep every clip inside that range."
              if duration > 0 else ""
          )

          moments = []
          for i, w in enumerate(windows):
              print(f"window {i + 1}/{len(windows)} ({w['start']:.0f}s–{w['end']:.0f}s)")
              discovery = (
                  "Read this transcript section and list every moment that could stand "
                  f"alone as a short vertical video.{length_hint} Be generous, but only "
                  "include moments with a clear beginning and end.\n\n"
                  f"Transcript:\n{w['text']}"
              )
              try:
                  candidates = ask(discovery, is_json=False)
              except Exception as exc:  # noqa: BLE001
                  print(f"  discovery failed: {exc}")
                  continue

              ranking = (
                  "Score each candidate 1-20 on all five axes, then return the best.\n"
                  "1) HOOK: does the first 3 seconds stop the scroll?\n"
                  "2) STANDALONE: understandable with zero context?\n"
                  "3) EMOTION: humour, surprise, tension or insight?\n"
                  "4) SHAREABILITY: would someone send this to a friend?\n"
                  "5) COMPLETENESS: clean start and a satisfying end?\n\n"
                  'Return JSON: {"clips": [{"start_time": <float seconds>, '
                  '"end_time": <float seconds>, "viral_score": <sum of the five scores, 5-100>, '
                  '"title": "...", "description": "...", "hashtags": ["#a", ...5 items], '
                  '"hook": "..."}]}\n'
                  f"start_time must fall between {w['start']:.1f} and {w['end']:.1f}. "
                  "Aim for 20-60 second clips unless the idea genuinely needs longer.\n\n"
                  f"Candidates:\n{candidates}"
              )
              try:
                  parsed = json.loads(ask(ranking, is_json=True))
                  found = parsed.get("clips", [])
                  print(f"  {len(found)} candidate(s)")
                  moments.extend(found)
              except Exception as exc:  # noqa: BLE001
                  print(f"  ranking failed: {exc}")

          if not moments:
              print("FATAL: no moments identified"); sys.exit(1)

          # ── Normalise, clamp, de-duplicate ──────────────────────────────
          clean = []
          for m in moments:
              try:
                  s, e = float(m["start_time"]), float(m["end_time"])
              except (KeyError, TypeError, ValueError):
                  continue
              if e <= s:
                  continue
              if duration > 0:
                  s = max(0.0, min(s, duration - 5))
                  e = max(s + 5, min(e, duration))
              clean.append({**m, "start_time": s, "end_time": e,
                            "viral_score": max(0.0, min(100.0, float(m.get("viral_score", 50))))})

          clean.sort(key=lambda m: m["viral_score"], reverse=True)
          kept = []
          for m in clean:
              if any(min(m["end_time"], k["end_time"]) - max(m["start_time"], k["start_time"]) > 5
                     for k in kept):
                  continue
              kept.append(m)
              if len(kept) >= max_clips * 2:   # spares for the prepare step
                  break

          # ── Audio-energy boost ──────────────────────────────────────────
          energy = []
          try:
              t = 0.0
              for line in open("workspace/audio/energy.txt"):
                  mt = re.search(r"pts_time:(\d+\.?\d*)", line)
                  if mt:
                      t = float(mt.group(1))
                  mr = re.search(r"RMS_level=(-?\d+\.?\d*)", line)
                  if mr:
                      energy.append((t, float(mr.group(1))))
          except FileNotFoundError:
              print("energy.txt missing — skipping energy boost")

          if len(energy) >= 2:
              values = [v for _, v in energy if v > -100]
              if len(values) >= 2:
                  cut = statistics.mean(values) + statistics.stdev(values)
                  peaks = [t for t, v in energy if v > cut]
                  for m in kept:
                      n = sum(1 for p in peaks if m["start_time"] <= p <= m["end_time"])
                      if n:
                          m["viral_score"] = min(100.0, m["viral_score"] + min(15, n * 3))
                          m["energy_peaks"] = n
                  print(f"energy peaks: {len(peaks)} (threshold {cut:.1f} dB)")

          kept.sort(key=lambda m: m["viral_score"], reverse=True)
          kept = kept[:max_clips]
          json.dump({"clips": kept}, open("workspace/clips/viral_moments.json", "w"), indent=2)
          print(f"VIRAL_OK moments={len(kept)} top_score={kept[0]['viral_score']:.0f}")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # 7. Prepare clips: cut → vertical reframe → loudness → captions
      # ─────────────────────────────────────────────────────────────────────
      - name: "Mark: clipping"
        run: python3 pipeline/db.py set-status --job-id "${{ inputs.job_id }}" --status clipping --progress 55

      - name: Prepare vertical clips
        run: |
          set -euo pipefail
          echo "prepare_clips" > workspace/.current_step
          python3 pipeline/prepare_clips.py \
            --source workspace/source/source.mp4 \
            --moments workspace/clips/viral_moments.json \
            --captions workspace/audio/full_captions.json \
            --silences workspace/audio/silences.txt \
            --outdir workspace/clips

      # ─────────────────────────────────────────────────────────────────────
      # 8. Render captions (parallel; failures are reported, never hidden)
      # ─────────────────────────────────────────────────────────────────────
      - name: "Mark: captioning"
        run: python3 pipeline/db.py set-status --job-id "${{ inputs.job_id }}" --status captioning --progress 70

      - name: Render captions
        run: |
          set -euo pipefail
          echo "render_captions" > workspace/.current_step
          python3 pipeline/render_clips.py \
            --clipsdir workspace/clips \
            --outdir workspace/captioned \
            --remotion-dir remotion-captions \
            --style "${{ inputs.caption_style }}" \
            --platform tiktok \
            --concurrency 2 \
            --report workspace/render_report.json

      - name: Generate thumbnails
        run: |
          set -euo pipefail
          echo "thumbnails" > workspace/.current_step
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          clips = sorted(Path("workspace/captioned").glob("*_captioned.mp4"))
          moments = json.load(open("workspace/clips/viral_moments.json")).get("clips", [])
          has_magick = subprocess.run(["which", "magick"], capture_output=True).returncode == 0

          made = 0
          for clip in clips:
              index = int(clip.stem.split("_")[1])
              raw = subprocess.run(
                  ["ffprobe", "-v", "quiet", "-show_entries", "format=duration",
                   "-of", "csv=p=0", str(clip)], capture_output=True, text=True).stdout.strip()
              duration = float(raw or 3)
              # 30% in is reliably past any intro and still shows the speaker.
              at = max(0.5, duration * 0.3)
              out = Path("workspace/thumbnails") / f"{clip.stem.replace('_captioned', '')}_thumb.jpg"

              subprocess.run([
                  "ffmpeg", "-ss", f"{at:.2f}", "-i", str(clip), "-frames:v", "1",
                  "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,"
                         "crop=1080:1920,gblur=sigma=14,eq=brightness=-0.12",
                  "-q:v", "3", str(out), "-y", "-loglevel", "error",
              ], check=False)

              title = str(moments[index].get("title", ""))[:70] if index < len(moments) else ""
              if title and has_magick and out.exists():
                  text_file = out.with_suffix(".txt")
                  text_file.write_text(title.replace("\n", " "))
                  # Wrap long titles so they do not run off the frame.
                  subprocess.run([
                      "magick", str(out),
                      "-gravity", "center",
                      "-font", "DejaVu-Sans-Bold", "-pointsize", "76",
                      "-stroke", "black", "-strokewidth", "6", "-fill", "white",
                      "-size", "900x", "-annotate", "+0+0", f"@{text_file}",
                      str(out),
                  ], check=False)
                  text_file.unlink(missing_ok=True)
              made += 1

          print(f"THUMBNAILS_OK count={made}")
          if made == 0:
              raise SystemExit("FATAL: no thumbnails generated")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # 9. Upload
      # ─────────────────────────────────────────────────────────────────────
      - name: "Mark: uploading"
        run: python3 pipeline/db.py set-status --job-id "${{ inputs.job_id }}" --status uploading --progress 88

      - name: Configure rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Upload to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          echo "upload" > workspace/.current_step
          REMOTE=$(rclone listremotes | head -1 | tr -d ':')
          BASE="ClipMint/${JOB_ID}"

          rclone copy workspace/captioned/ "${REMOTE}:${BASE}/clips/" \
            --drive-root-folder-id="$GDRIVE_FOLDER_ID" \
            --transfers 4 --checkers 8 --stats-one-line
          rclone copy workspace/thumbnails/ "${REMOTE}:${BASE}/thumbnails/" \
            --drive-root-folder-id="$GDRIVE_FOLDER_ID" \
            --transfers 4 --checkers 8 --stats-one-line

          python3 - <<'PY'
          import json, os, subprocess

          job_id = os.environ["JOB_ID"]
          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          remote = subprocess.run(["rclone", "listremotes"], capture_output=True,
                                  text=True).stdout.split(":")[0].strip()
          base = f"ClipMint/{job_id}"

          def listing(path):
              resp = subprocess.run(
                  ["rclone", "lsjson", f"{remote}:{path}",
                   f"--drive-root-folder-id={folder_id}"],
                  capture_output=True, text=True)
              if resp.returncode != 0:
                  return []
              try:
                  return json.loads(resp.stdout or "[]")
              except json.JSONDecodeError:
                  return []

          clips = []
          for f in listing(f"{base}/clips"):
              if f["Name"].endswith(".mp4"):
                  fid = f.get("ID", "")
                  clips.append({
                      "name": f["Name"],
                      "id": fid,
                      "url": f"https://drive.google.com/file/d/{fid}/view" if fid else "",
                  })

          thumbs = {}
          for f in listing(f"{base}/thumbnails"):
              fid = f.get("ID", "")
              if fid:
                  thumbs[f["Name"].replace("_thumb.jpg", "")] = (
                      f"https://drive.google.com/thumbnail?id={fid}&sz=w540"
                  )

          for c in clips:
              c["thumbnail_url"] = thumbs.get(c["name"].replace("_captioned.mp4", ""), "")

          json.dump({"job_id": job_id, "folder_id": folder_id, "clips": clips},
                    open("workspace/output/upload_manifest.json", "w"), indent=2)
          print(f"UPLOAD_MANIFEST_OK clips={len(clips)} thumbs={len(thumbs)}")
          if not clips:
              raise SystemExit("FATAL: nothing was uploaded")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # 10. Record results
      # ─────────────────────────────────────────────────────────────────────
      - name: Save results to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          echo "save_results" > workspace/.current_step
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          sys.path.insert(0, "pipeline")
          from db import Supabase

          job_id = os.environ["JOB_ID"]
          db = Supabase()

          manifest = json.load(open("workspace/output/upload_manifest.json"))
          prepared = {c["file"]: c for c in json.load(open("workspace/clips/clips_manifest.json"))}
          moments = json.load(open("workspace/clips/viral_moments.json")).get("clips", [])
          render = json.load(open("workspace/render_report.json"))
          render_by_index = {r["index"]: r for r in render["results"]}

          user_id = db.get_job(job_id)["user_id"]
          rows, failed = [], []

          for index, clip in enumerate(manifest["clips"]):
              info = prepared.get(f"clip_{index:03d}.mp4", {})
              moment = moments[index] if index < len(moments) else {}
              rendered = render_by_index.get(index, {})
              captured = bool(rendered.get("ok"))

              rows.append({
                  "job_id": job_id,
                  "user_id": user_id,
                  "clip_index": index,
                  "filename": clip["name"],
                  "duration_seconds": info.get("duration"),
                  # Prefer the window ffmpeg ACTUALLY rendered (silence-snapped
                  # and length-clamped) over the raw moment, so the stored span
                  # always matches the delivered clip.
                  "start_time": float(info.get("start", moment.get("start_time", 0)) or 0),
                  "end_time": float(info.get("end", moment.get("end_time", 0)) or 0),
                  "title": moment.get("title", f"Clip {index + 1}"),
                  "description": moment.get("description", ""),
                  "hashtags": moment.get("hashtags", []),
                  "hook_caption": moment.get("hook", ""),
                  "viral_score": int(float(moment.get("viral_score", 50) or 50)),
                  "drive_file_id": clip.get("id", ""),
                  "drive_url": clip.get("url", ""),
                  "thumbnail_url": clip.get("thumbnail_url", ""),
                  # A clip whose captions failed to render is marked failed rather
                  # than quietly delivered without captions.
                  "status": "ready" if captured else "failed",
              })
              if not captured:
                  failed.append(index)

          inserted = db.insert_clips(job_id, rows)

          db.update_job(
              job_id,
              status="done",
              progress=100,
              clips_count=len(rows),
              drive_folder_id=manifest.get("folder_id", ""),
              completed_at=datetime.now(timezone.utc).isoformat(),
              error_message=(
                  f"{len(failed)} of {len(rows)} clips could not be captioned "
                  f"(clip indexes {failed})."
                  if failed else None
              ),
          )
          print(f"SAVE_OK clips={inserted} caption_failures={len(failed)}")
          if failed:
              print("WARNING: some clips were delivered without captions and marked failed")
          PY

      # ─────────────────────────────────────────────────────────────────────
      # 11. Notifications
      # ─────────────────────────────────────────────────────────────────────
      - name: Notify completion
        if: always()
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_STATUS: ${{ job.status }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -uo pipefail
          case "$JOB_STATUS" in
            success)   export EMAIL_STATUS="done";      export ERROR_MSG="" ;;
            cancelled) export EMAIL_STATUS="cancelled"; export ERROR_MSG="Processing was cancelled." ;;
            *)         export EMAIL_STATUS="failed";    export ERROR_MSG="Video processing failed. Please try again." ;;
          esac
          export CURRENT_STEP="$(cat workspace/.current_step 2>/dev/null || echo unknown)"

          if [ -n "${DASHBOARD_URL:-}" ] && [ -n "${WEBHOOK_SECRET:-}" ]; then
            python3 - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              "job_id": os.environ["JOB_ID"],
              "status": os.environ["EMAIL_STATUS"],
              "error_message": os.environ.get("ERROR_MSG", ""),
              "webhook_secret": os.environ["WEBHOOK_SECRET"],
          }).encode()
          req = urllib.request.Request(
              os.environ["DASHBOARD_URL"].rstrip("/") + "/api/webhooks/job-status",
              data=payload, headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print("webhook:", resp.status, resp.read()[:200].decode(errors="ignore"))
          except Exception as exc:
              print("webhook failed (non-critical):", exc)
          PY
          fi

          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            python3 - <<'PY'
          import json, os, urllib.request
          status = os.environ["JOB_STATUS"]
          if status == "success":
              msg = f"✅ ClipMint job `{os.environ['JOB_ID']}` completed."
          elif status == "cancelled":
              msg = f"⚠️ ClipMint job `{os.environ['JOB_ID']}` was cancelled."
          else:
              msg = (f"❌ ClipMint job `{os.environ['JOB_ID']}` failed at step: "
                     f"{os.environ.get('CURRENT_STEP', 'unknown')}.")
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps({"content": msg}).encode(),
              headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=20)
          except Exception as exc:
              print("discord failed (non-critical):", exc)
          PY
          fi

      # ─────────────────────────────────────────────────────────────────────
      # 12. Failure handling
      # ─────────────────────────────────────────────────────────────────────
      - name: Record failure
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -uo pipefail
          STEP=$(cat workspace/.current_step 2>/dev/null || echo "unknown")
          export STEP

          # Translate the internal stage name into something the customer can act on.
          case "$STEP" in
            download)        export REASON="We could not download that video. Check that the link is public and is a supported source (YouTube, Instagram, Facebook, Vimeo, Google Drive or a direct video file)." ;;
            extract_audio)   export REASON="The downloaded file had no readable audio track." ;;
            transcribe)      export REASON="Speech transcription failed for this video." ;;
            prepare_clips)   export REASON="We could not create clips from this video — it may be too short or contain no speech." ;;
            render_captions) export REASON="Caption rendering failed. This is usually temporary — please retry." ;;
            thumbnails)      export REASON="Thumbnail generation failed." ;;
            upload)          export REASON="We could not upload the finished clips." ;;
            save_results)    export REASON="We could not save the results." ;;
            *)               export REASON="Processing failed while running: ${STEP}." ;;
          esac

          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "pipeline")
          from db import Supabase
          try:
              Supabase().set_error(os.environ["JOB_ID"], os.environ["REASON"])
              print("recorded failure — step:", os.environ.get("STEP"))
          except Exception as exc:
              print("could not record failure:", exc)
          PY
