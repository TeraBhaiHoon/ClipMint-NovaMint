name: Keep Supabase Alive

on:
  schedule:
    # Run every day at 6 AM UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ClipMint Supabase
        env:
          # The anon key is public by design (RLS protects the data) — but
          # it belongs in a secret, not hardcoded, so rotation is one place.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🏓 Pinging ClipMint Supabase..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=count&limit=1" \n            -H "apikey: ${SUPABASE_ANON_KEY}" \n            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Status: $HTTP_CODE"
          echo "Body: $BODY"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ ClipMint Supabase is alive!"
          else
            echo "❌ ClipMint ping failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Summary
        run: |
          echo "================================================"
          echo "🎉 Keep-alive pings completed at $(date -u)"
          echo "================================================"
